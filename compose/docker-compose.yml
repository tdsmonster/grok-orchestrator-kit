# =============================================================================
# GROK-ORCHESTRATOR-KIT — NovaApi / Sub2API gateway cluster
# =============================================================================
# Quick start / 快速启动:
#   cp .env.example .env          # then edit the secrets / 改成你自己的密码
#   docker compose up -d
#
# All secrets are injected from the environment (or a sibling .env file).
# Never commit real credentials — .env is git-ignored.
# 所有密钥均通过环境变量注入（可放在同目录 .env 中），.env 已被 git 忽略。
# =============================================================================

services:
  # NovaApi / Sub2API high-concurrency gateway / 高并发反代中枢
  novaapi:
    image: weishaw/sub2api:latest # public stable image (amd64 + arm64)
    container_name: novaapi
    restart: unless-stopped
    ports:
      # Bound to loopback by default. Set NOVAAPI_BIND=0.0.0.0 to expose on LAN.
      # 默认仅监听本机回环，需要局域网访问时设置 NOVAAPI_BIND=0.0.0.0。
      - "${NOVAAPI_BIND:-127.0.0.1}:${NOVAAPI_PORT:-8000}:8080"
    volumes:
      - novaapi_data:/app/data
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=release
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=sub2api
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-sub2api_local_dev_pass}
      - DATABASE_DBNAME=sub2api
      - DATABASE_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Admin bootstrap account — the worker script reads the same values.
      # 管理员初始账号；worker 脚本会自动从 ProGrok 配置或环境变量读取同一组凭据。
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@novaapi.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change_me_before_exposing}
      - TZ=${TZ:-Asia/Shanghai}
      - XAI_GROK_CLI_VERSION=${XAI_GROK_CLI_VERSION:-1.0.13}
      - SECURITY_URL_ALLOWLIST_ENABLED=false
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novaapi-network

  # Persistence layer / 数据库持久层 (PostgreSQL 18)
  postgres:
    image: postgres:18-alpine
    container_name: novaapi-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_USER=sub2api
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sub2api_local_dev_pass}
      - POSTGRES_DB=sub2api
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - novaapi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache / rate-limit layer / 缓存与令牌桶层 (Redis 8)
  redis:
    image: redis:8-alpine
    container_name: novaapi-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - novaapi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  novaapi_data:
  postgres_data:
  redis_data:

networks:
  novaapi-network:
    driver: bridge
